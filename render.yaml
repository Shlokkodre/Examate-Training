# ── HealthLabelCheck — Render deployment (Docker Hub images) ─────────────────
# Render pulls pre-built images from Docker Hub — no build step on Render.
#
# Images (public):
#   docker.io/shlok0626/healthlabelcheck-api:latest  — FastAPI backend
#   docker.io/shlok0626/healthlabelcheck-web:latest  — Streamlit UI
#
# Re-push flow: rebuild locally, `docker push` both, then in Render dashboard
# trigger "Clear build cache & deploy" (or bump the tag) to pull the new image.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: healthlabelcheck-api
    runtime: image
    plan: free          # upgrade for more RAM if the agent endpoint needs it
    region: singapore   # closest to India
    branch: main
    healthCheckPath: /health
    image:
      url: docker.io/shlok0626/healthlabelcheck-api:latest

    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "500"
      - key: LLM_TOP_P
        value: "0.9"
      - key: GROQ_API_KEY
        sync: false       # secret — enter value in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Streamlit UI ─────────────────────────────────────────────────────────
  - type: web
    name: healthlabelcheck-web
    runtime: image
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /_stcore/health
    image:
      url: docker.io/shlok0626/healthlabelcheck-web:latest

    # Free tier sleeps after 15 min of inactivity; first request after
    # sleep takes ~30 s to wake. Both services wake independently.

    envVars:
      - key: API_BASE
        fromService:
          type: web
          name: healthlabelcheck-api
          property: host
      - key: PYTHONUNBUFFERED
        value: "1"
