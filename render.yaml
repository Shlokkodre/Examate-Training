# ── HealthLabelCheck — Render deployment config ───────────────────────────────
# Deploy at: https://dashboard.render.com → New → Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: healthlabelcheck
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # upgrade to starter for persistent disk
    region: singapore   # closest to India
    branch: main

    # Environment variables — set secret values in Render dashboard
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "500"
      - key: LLM_TOP_P
        value: "0.9"
      - key: GROQ_API_KEY
        sync: false       # mark as secret — enter value in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"

    # Render free tier sleeps after 15 min of inactivity.
    # The first request after sleep takes ~30 s to wake up.
    healthCheckPath: /_stcore/health
