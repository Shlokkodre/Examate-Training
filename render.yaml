# ── HealthLabelCheck — Render deployment config (Docker) ────────────────────
# Two containers:
#   api  — FastAPI backend (Dockerfile.api), Chroma index built on first start
#   web  — Streamlit UI    (Dockerfile.web), talks to the api service over HTTP
#
# Deploy: https://dashboard.render.com → New → Blueprint (select this repo)
# Docs:   https://render.com/docs/blueprint-spec
#
# NOTE: both services must exist under names below; the web service gets
# API_BASE automatically from the api service's host.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: healthlabelcheck-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free          # upgrade for more RAM if the agent endpoint needs it
    region: singapore   # closest to India
    branch: main
    healthCheckPath: /health

    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "500"
      - key: LLM_TOP_P
        value: "0.9"
      - key: GROQ_API_KEY
        sync: false       # secret — enter value in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Streamlit UI ─────────────────────────────────────────────────────────
  - type: web
    name: healthlabelcheck-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /_stcore/health

    # Free tier sleeps after 15 min of inactivity; first request after
    # sleep takes ~30 s to wake. Both services wake independently.

    envVars:
      - key: API_BASE
        fromService:
          type: web
          name: healthlabelcheck-api
          property: host
      - key: PYTHONUNBUFFERED
        value: "1"
